services:
  - type: web
    name: viusic
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_API_BASE_URL
        value: https://api.mistral.ai/v1
      - key: SOUNDMIND_DOWNLOADER_PATH
        value: /app/tools/soundmind/SoundMind.Downloader
      - key: DOWNLOADER_FALLBACK_TO_YTDLP
        value: "0"
      - key: DOWNLOADER_FALLBACK_ON_ERROR
        value: "0"
      - key: YTDLP_JS_RUNTIMES
        value: node
      - key: YTDLP_REMOTE_COMPONENTS
        value: ejs:github
      - key: YTDLP_RETRIES
        value: "5"
      - key: YTDLP_FRAGMENT_RETRIES
        value: "5"
      - key: YTDLP_EXTRACTOR_RETRIES
        value: "5"
      - key: YTDLP_SLEEP_REQUESTS
        value: "3"
      - key: YTDLP_COOKIES_B64
        sync: false
      - key: YTDLP_COOKIES_FILE
        sync: false
      - key: ATTACH_DOWNLOAD_AUDIO_ONLY
        value: "1"
      - key: MAX_SCENES_FOR_VISION
        value: "8"
